<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>ERP API Ping 測試</title>
</head>

<body>
  <h1>ERP API 測試</h1>

  <button onclick="testApi()">測試 API</button>

  <pre id="result">尚未測試</pre>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbwXWT20BvgchbJaEEwiv0H5hFaqkIboTkPNSBqJpKCxdyoHwyv1mt-5dKRAumfJageacw/exec";

    async function testApi() {
      const result = document.getElementById("result");
      result.textContent = "測試中...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "ping"
          })
        });

        const text = await response.text();

        result.textContent =
          "HTTP：" + response.status + "\n\n" + text;

      } catch (error) {
        result.textContent =
          "失敗 ❌\n\n" + error.toString();

        console.error(error);
      }
    }
  </script>
</body>
</html>
